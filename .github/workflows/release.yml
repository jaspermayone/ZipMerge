name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign

          # Set keychain for codesigning
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Clean up certificate file
          rm certificate.p12

      - name: Build app
        run: |
          xcodebuild -project ZipMerge.xcodeproj \
            -scheme ZipMerge \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=M67B42LX8D \
            clean build

      - name: Sign app bundle
        run: |
          codesign --force --deep --sign "Developer ID Application" \
            --options runtime \
            --timestamp \
            ./build/Build/Products/Release/ZipMerge.app

      - name: Create DMG (optional, or use zip)
        run: |
          # Create a zip file for distribution
          cd ./build/Build/Products/Release
          zip -r ZipMerge.zip ZipMerge.app
          mv ZipMerge.zip $GITHUB_WORKSPACE/

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: M67B42LX8D
        run: |
          # Submit for notarization
          xcrun notarytool submit ZipMerge.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait

          # Unzip, staple, and re-zip
          unzip ZipMerge.zip
          xcrun stapler staple ZipMerge.app
          rm ZipMerge.zip
          zip -r ZipMerge.zip ZipMerge.app

      - name: Calculate SHA256
        id: sha
        run: |
          SHA256=$(shasum -a 256 ZipMerge.zip | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ZipMerge.zip
          body: |
            ## Installation

            ### Via Homebrew
            ```bash
            brew tap jaspermayone/tap
            brew install --cask zipmerge
            ```

            ### Manual Installation
            1. Download ZipMerge.zip
            2. Unzip and move ZipMerge.app to /Applications

            ## SHA256 Checksum
            ```
            ${{ steps.sha.outputs.sha256 }}
            ```

            ## Update Homebrew Cask
            Update the SHA256 in `Casks/zipmerge.rb`:
            ```ruby
            sha256 "${{ steps.sha.outputs.sha256 }}"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
